services:
  certs:
    build: ./${SERV_DIR}/certs
    container_name: t_certs
    env_file:
      - .env
    cap_drop:
      - ALL
    cap_add:
      - CHOWN   # for chown
      - FOWNER  # for chmod
    volumes:
      - ssl_certs:/etc/certs:nocopy
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network
    read_only: true # make root fs read-only
    restart: "no"

  nginx:
    build: ./${SERV_DIR}/nginx
    container_name: t_nginx
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - ssl_certs:/etc/nginx/ssl
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s  # Give init.sh time to run
    depends_on:
      frontend:
        condition: service_healthy
    restart: "always"
    networks:
      - app-network

  frontend:
    build: ./${SERV_DIR}/frontend
    init: true
    container_name: t_frontend
    expose:
      - "${FRONTEND_PORT}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/frontend-ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    depends_on:
      backend:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    volumes:
      - frontend_app:/app:nocopy
      - ssl_certs:/etc/ssl/certs/app:ro
    restart: "always"
    networks:
      - app-network

  backend:
    build: ./${SERV_DIR}/backend
    init: true
    container_name: t_backend
    expose:
      - "${BACKEND_PORT}"
    ports:
      - "3000:3000"           # RMB TO REMOVE before production
    env_file:
      - .env
      - ./data/backend/.env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backend-ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    depends_on:
      certs:
        condition: service_completed_successfully
    secrets:
      - jwt_secret
      - app_root
      - app_mock
      - livekit_api_key
      - livekit_api_secret
      - database_url
      - direct_url
      - supabase_service_role_key
      - supabase_s3_access_key
      - supabase_s3_secret_key
      - google_client_secret
      - google_ai_api_key
      - smtp_user
      - smtp_password
    volumes:
      - backend_app:/app:nocopy
      - ssl_certs:/etc/ssl/certs/app:ro
    restart: "always"
    networks:
      - app-network

  whisper:
    build: ./${SERV_DIR}/whisper
    container_name: t_whisper
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ssl_certs:/etc/ssl/certs/app:ro
    restart: "always"
    networks:
      - app-network

volumes:
  frontend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/frontend
      o: bind

  backend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/backend
      o: bind

  ssl_certs:
    driver: local

networks:
  app-network:
    driver: bridge

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  app_root:
    file: ./secrets/app_admin_password.txt
  app_mock:
    file: ./secrets/app_mock_user_password.txt
  livekit_api_key:
    file: ./secrets/livekit_api_key.txt
  livekit_api_secret:
    file: ./secrets/livekit_api_secret.txt
  database_url:
    file: ./secrets/database_url.txt
  direct_url:
    file: ./secrets/direct_url.txt
  supabase_service_role_key:
    file: ./secrets/supabase_service_role_key.txt
  supabase_s3_access_key:
    file: ./secrets/supabase_s3_access_key.txt
  supabase_s3_secret_key:
    file: ./secrets/supabase_s3_secret_key.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  google_ai_api_key:
    file: ./secrets/google_ai_api_key.txt
  smtp_user:
    file: ./secrets/smtp_user.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
