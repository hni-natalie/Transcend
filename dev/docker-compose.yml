services:

  nginx:
    build: ./${SERV_DIR}/nginx
    container_name: t_nginx
    ports:
      - "443:443"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s  # Give init.sh time to run
    depends_on:
      frontend:
        condition: service_healthy
    # restart: unless-stopped
    networks:
      - app-network

  frontend: 
    build: ./${SERV_DIR}/frontend
    init: true
    container_name: t_frontend
    expose:
      - "${FRONTEND_PORT}"  # Expose internally, not to host
    env_file:
      - .env
    healthcheck:
        # test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT}"]
        test: ["CMD", "test", "-f", "/tmp/frontend-ready"]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_app:/app:nocopy
    # restart: unless-stopped
    networks:
      - app-network
  
  backend:
    build: ./${SERV_DIR}/backend
    init: true
    container_name: t_backend
    expose:
      - "${BACKEND_PORT}"  # Expose internally, not to host
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backend-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    secrets:
      - livekit_api_key
      - livekit_api_secret
    volumes:
      - backend_app:/app:nocopy
    # restart: unless-stopped
    networks:
      - app-network

volumes:
  frontend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/frontend
      o: bind

  backend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/backend
      o: bind

  database:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/database
      o: bind

networks:
  app-network:
    driver: bridge


secrets:
  livekit_api_key:
    file: ./secrets/livekit_api_key.txt
  livekit_api_secret:
    file: ./secrets/livekit_api_secret.txt