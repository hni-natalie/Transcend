services:

  nginx:
    build: ./${SERV_DIR}/nginx
    container_name: t_nginx
    ports:
      - "443:443"
    env_file:
      - .env
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend: 
    build: ./${SERV_DIR}/frontend
    init: true
    container_name: t_frontend
    expose:
      - "${FRONTEND_PORT}"  # Expose internally, not to host
    env_file:
      - .env
    healthcheck:
        test: ["CMD", "test", "-f", "/tmp/frontend-ready"]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 30s  # Give init.sh time to run
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_app:/app:nocopy
    # restart: unless-stopped
    networks:
      - app-network
  
  backend:
    build: ./${SERV_DIR}/backend
    container_name: t_backend
    expose:
      - "${BACKEND_PORT}"  # Expose internally, not to host
    ports:
      - "3000:3000" # For testing (RMB TO REMOVE)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backend-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Give your app time to start
    volumes:
      - backend_app:/app:nocopy
    # restart: unless-stopped
    secrets:
      - db_user
    networks:
      - app-network

  database:
    build: ./${SERV_DIR}/database
    container_name: t_database
    expose:
      - "${DATABASE_PORT}"  # Expose internally, not to host
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/database-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  # Give your app time to start
    volumes:
      - database:/app:nocopy
    secrets:
      - db_user
      - db_root
    networks:
      - app-network

  adminer:
    build: ./${SERV_DIR}/adminer
    container_name: t_adminer
    expose:
      - "${ADMINER_PORT}"
    depends_on:
      - database
    networks:
      - app-network


volumes:
  frontend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/frontend
      o: bind

  backend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/backend
      o: bind

  database:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/database
      o: bind


networks:
  app-network:
    driver: bridge


secrets:
  db_root:
    file: ./secrets/database_root.txt
  db_user:
    file: ./secrets/database_user.txt