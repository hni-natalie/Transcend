services:

  nginx:
    build: ./${SERV_DIR}/nginx
    container_name: t_nginx
    ports:
      - "443:443"
    env_file:
      - .env
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./${SERV_DIR}/frontend
    init: true
    container_name: t_frontend
    expose:
      - "${FRONTEND_PORT}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/frontend-ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_app:/app:nocopy
    networks:
      - app-network

  backend:
    build: ./${SERV_DIR}/backend
    init: true
    container_name: t_backend
    expose:
      - "${BACKEND_PORT}"
    ports:
      - "3000:3000"           # RMB TO REMOVE before production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backend-ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend_app:/app:nocopy
    secrets:
      - db_user
      - db_root
      - app_root
      - jwt_secret
    networks:
      - app-network

  database:
    image: pgvector/pgvector:pg16
    container_name: t_database
    expose:
      - "${DATABASE_PORT}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root
    healthcheck:
      # Without -U, pg_isready uses OS user "root" (no such PostgreSQL role). Values come from project .env at compose parse time.
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USER}\" -d \"${DB_NAME}\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - database:/var/lib/postgresql/data
      - ./services/database/init:/docker-entrypoint-initdb.d
    secrets:
      - db_user
      - db_root
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: t_adminer
    expose:
      - "${ADMINER_PORT}"
    ports:
      - "${ADMINER_PORT}:${ADMINER_PORT}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

volumes:
  frontend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/frontend
      o: bind

  backend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/backend
      o: bind

  database:
    driver: local

networks:
  app-network:
    driver: bridge

secrets:
  db_root:
    file: ./secrets/database_root.txt
  db_user:
    file: ./secrets/database_user.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  app_root:
    file: ./secrets/app_admin_password.txt
