services:

  nginx:
    build: ./${SERV_DIR}/nginx
    container_name: t_nginx
    ports:
      - "443:443"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s  # Give init.sh time to run
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./${SERV_DIR}/frontend
    init: true
    container_name: t_frontend
    expose:
      - "${FRONTEND_PORT}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/frontend-ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend_app:/app:nocopy
    networks:
      - app-network

  backend:
    build: ./${SERV_DIR}/backend
    init: true
    container_name: t_backend
    expose:
      - "${BACKEND_PORT}"
    ports:
      - "3000:3000"           # RMB TO REMOVE before production
      - "5555:5555"           # uncomment for dev
    env_file:
      - .env
      - ./data/backend/.env
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/backend-ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    secrets:
      - jwt_secret
      - app_root
      - livekit_api_key
      - livekit_api_secret
    volumes:
      - backend_app:/app:nocopy
    networks:
      - app-network

volumes:
  frontend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/frontend
      o: bind

  backend_app:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/dev/data/backend
      o: bind

networks:
  app-network:
    driver: bridge

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  app_root:
    file: ./secrets/app_admin_password.txt
  livekit_api_key:
    file: ./secrets/livekit_api_key.txt
  livekit_api_secret:
    file: ./secrets/livekit_api_secret.txt