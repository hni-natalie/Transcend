# this version uses upstream,
# container ip address is cached once started
# ideal for production env where no frequent docker start/stop

user nginx;

events {
    worker_connections 1024;
}

http {
	map $http_upgrade $connection_upgrade {
			default upgrade;
			'' close;
	}

	# rate limit zones: key by client IP
	limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
	# MIME types (to interpret files properly)
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# nginx to always get current frontend ip
	# resolver 127.0.0.11 valid=10s;
	# resolver_timeout 5s;

	# nginx caches ip once start, not work if stop container
	upstream frontend_upstream {
			server frontend:${FRONTEND_PORT};
	}

	upstream backend_upstream {
			server backend:${BACKEND_PORT};
	}

	server {

		listen 443 ssl;
		listen [::]:443 ssl;

		server_name         ${DOMAIN_NAME} localhost;

		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_certificate     /etc/nginx/ssl/${DOMAIN_NAME}.crt;
		ssl_certificate_key /etc/nginx/ssl/${DOMAIN_NAME}.key;
    ssl_ciphers         HIGH:!aNULL:!MD5;

		# configure paths
		# logs; access(requests), error(errors)
		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;

    # API routes go to backend
    location /api/socket.io/ {
        proxy_pass https://backend_upstream/socket.io/;
        proxy_ssl_verify off; # backend uses self-signed internal cert
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
				
				# WebSocket support
				proxy_http_version 1.1; # for keep-alive
				proxy_set_header Upgrade $http_upgrade;
				proxy_set_header Connection $connection_upgrade;
				
				# Timeouts (adjust as needed)
				proxy_read_timeout 60s;
				proxy_connect_timeout 60s;
				
				# Buffer settings for long-polling
				proxy_buffering off;
				proxy_cache off;
    }
    # tighter limit on auth endpoints (brute force guard)
    location ~ ^/api/auth/(login|google) {
        limit_req zone=api_auth burst=5 nodelay;
		    limit_req_status 429;   # return 429

        proxy_pass https://backend_upstream;
        proxy_ssl_verify off; # backend uses self-signed internal cert
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
				client_max_body_size 50M;
				limit_req zone=api_general burst=20 nodelay;

        proxy_pass https://backend_upstream; # proxy transparently
        proxy_ssl_verify off; # backend uses self-signed internal cert
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

		location / {
				proxy_pass https://frontend_upstream;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;

				# WebSocket support for Vite HMR
				proxy_http_version 1.1;
				proxy_set_header Upgrade $http_upgrade;
				proxy_set_header Connection "upgrade";
				
				# Increase timeouts for dev server
				proxy_connect_timeout 60s;
				proxy_send_timeout 60s;
				proxy_read_timeout 60s;
		}
		autoindex off;
	}
}