events {
    worker_connections 1024;
}

http {
	upstream frontend_upstream {
			server frontend:${FRONTEND_PORT};  # 'frontend' matches container_name
	}

	upstream backend_upstream {
			server backend:${BACKEND_PORT};   # Assuming your backend runs on port 3000
	}

	server {
		listen 443 ssl;
		listen [::]:443 ssl;

		server_name         ${DOMAIN_NAME} localhost;

		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_certificate     /etc/nginx/ssl/${DOMAIN_NAME}.crt;
		ssl_certificate_key /etc/nginx/ssl/${DOMAIN_NAME}.key;
    ssl_ciphers         HIGH:!aNULL:!MD5;

		# Root directory for WordPress
		# root /var/www/html;
		# index index.php index.html index.htm;

		# configure paths
		# logs; access(requests), error(errors)
		access_log /var/log/nginx/access.log;
		error_log /var/log/nginx/error.log;

    # API routes go to backend
    location /api/ {
        proxy_pass http://backend_upstream/; # strips /api/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
		location / {
				proxy_pass http://frontend_upstream;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				
				# WebSocket support for Vite HMR
				proxy_http_version 1.1;
				proxy_set_header Upgrade $http_upgrade;
				proxy_set_header Connection "upgrade";
				
				# Increase timeouts for dev server
				proxy_connect_timeout 60s;
				proxy_send_timeout 60s;
				proxy_read_timeout 60s;
		}
		autoindex off;
	}
}
